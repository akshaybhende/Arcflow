<header class="topbar">
  @if (globalLoading$ | async) {
    <mat-progress-bar class="topbar__progress" mode="indeterminate"></mat-progress-bar>
  }

  <div class="topbar__inner">
    @if (showMenu()) {
      <button
        mat-icon-button
        type="button"
        class="topbar__menu"
        (click)="onMenuClick()"
        aria-label="Open navigation menu"
      >
        <mat-icon>menu</mat-icon>
      </button>
    }
    <h2 class="topbar__title">{{ pageTitle$ | async }}</h2>

    <div class="topbar__search">
      <mat-icon class="topbar__search-icon" aria-hidden="true">search</mat-icon>
      <input
        type="search"
        class="topbar__search-input"
        placeholder="Search contacts, deals..."
        [(ngModel)]="searchQuery"
        aria-label="Global search"
      />
    </div>

    <div class="topbar__actions">
      <button
        mat-icon-button
        type="button"
        (click)="onToggleTheme()"
        [attr.aria-label]="(theme$ | async) === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <mat-icon>{{ (theme$ | async) === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <button mat-icon-button type="button" aria-label="Notifications">
        <mat-icon
          [matBadge]="(unreadCount$ | async) || null"
          [matBadgeHidden]="((unreadCount$ | async) ?? 0) === 0"
          matBadgeColor="warn"
          matBadgeSize="small"
        >
          notifications
        </mat-icon>
      </button>

      @if (currentUser$ | async; as user) {
        <button mat-button [matMenuTriggerFor]="userMenu" class="topbar__user-btn" type="button">
          <app-avatar [src]="user.avatar" [name]="user.name" size="sm"></app-avatar>
          <span class="topbar__user-name">{{ user.name }}</span>
          <mat-icon>expand_more</mat-icon>
        </button>
      }

      <mat-menu #userMenu="matMenu" xPosition="before">
        <button mat-menu-item type="button" routerLink="/settings">
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item type="button" routerLink="/settings">
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item type="button" (click)="onLogout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </div>
  </div>
</header>
