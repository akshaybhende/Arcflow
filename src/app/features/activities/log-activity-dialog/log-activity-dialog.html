<div class="p-6 flex flex-col gap-5" [formGroup]="form">
  <!-- Dialog title -->
  <h2 class="text-lg font-semibold text-foreground">{{ dialogTitle }}</h2>

  <div class="h-px bg-border"></div>

  <!-- Activity type radio group -->
  <div class="flex flex-col gap-2">
    <span class="text-sm font-medium leading-none">Type</span>
    <div class="flex flex-wrap gap-2">
      @for (type of activityTypes; track type) {
        <label
          class="flex items-center gap-2 cursor-pointer rounded-md border px-3 py-2 text-sm transition-colors"
          [class]="form.controls.type.value === type ? 'border-primary bg-primary/10 text-primary' : 'border-input bg-background hover:bg-muted/50'"
        >
          <input
            type="radio"
            class="sr-only"
            [value]="type"
            formControlName="type"
          />
          <span class="material-icons-round text-base" [style.color]="typeMeta[type].color">{{ typeMeta[type].icon }}</span>
          <span>{{ typeMeta[type].label }}</span>
        </label>
      }
    </div>
  </div>

  <!-- Title -->
  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-medium leading-none" for="log-title">Title</label>
    <input
      id="log-title"
      class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
      formControlName="title"
      placeholder="Activity title"
    />
    @if (form.controls.title.touched && form.controls.title.invalid) {
      <p class="text-xs text-destructive">Title is required</p>
    }
  </div>

  <!-- Description -->
  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-medium leading-none" for="log-desc">Description</label>
    <textarea
      id="log-desc"
      class="flex w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring resize-none"
      formControlName="description"
      rows="3"
      placeholder="Optional description..."
    ></textarea>
  </div>

  <!-- Contact (datalist autocomplete) -->
  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-medium leading-none" for="log-contact">Contact</label>
    <input
      id="log-contact"
      class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
      formControlName="contactSearch"
      list="log-contact-list"
      placeholder="Search contacts..."
    />
    <datalist id="log-contact-list">
      @for (contact of filteredContacts; track contact.id) {
        <option [value]="contact.firstName + ' ' + contact.lastName + ' (' + contact.email + ')'"></option>
      }
    </datalist>
  </div>

  <!-- Deal (datalist autocomplete) -->
  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-medium leading-none" for="log-deal">Deal</label>
    <input
      id="log-deal"
      class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
      formControlName="dealSearch"
      list="log-deal-list"
      placeholder="Search deals..."
    />
    <datalist id="log-deal-list">
      @for (deal of filteredDeals; track deal.id) {
        <option [value]="deal.title"></option>
      }
    </datalist>
  </div>

  <!-- Status -->
  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-medium leading-none" for="log-status">Status</label>
    <select
      id="log-status"
      class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring"
      formControlName="status"
    >
      <option value="pending">Pending</option>
      <option value="completed">Completed</option>
    </select>
  </div>

  <!-- Due date (conditional) -->
  @if (showDueDate) {
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium leading-none" for="log-dueDate">Due date</label>
      <input
        id="log-dueDate"
        class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring"
        type="date"
        formControlName="dueDate"
      />
    </div>
  }

  <div class="h-px bg-border"></div>

  <!-- Dialog actions -->
  <div class="flex items-center justify-end gap-3">
    <button
      type="button"
      class="inline-flex items-center gap-2 rounded-md border border-input bg-background px-4 py-2 text-sm font-medium hover:bg-accent hover:text-accent-foreground transition-colors"
      (click)="onCancel()"
    >Cancel</button>
    <button
      type="button"
      class="inline-flex items-center gap-2 rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground hover:bg-primary/90 transition-colors"
      (click)="onSubmit()"
    >
      {{ isEdit ? 'Save' : 'Log Activity' }}
    </button>
  </div>
</div>
