<div class="max-w-2xl mx-auto">
  <div class="mb-6">
    <app-page-header
      [title]="isEditMode ? 'Edit Company' : 'New Company'"
      [subtitle]="isEditMode ? 'Update organization details' : 'Add a new organization'"
    />
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
    <div class="rounded-lg border bg-card p-6 flex flex-col gap-4">
      <h2 class="text-base font-semibold">Company information</h2>

      <!-- Name -->
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium">Name <span class="text-destructive">*</span></label>
        <input
          type="text"
          formControlName="name"
          placeholder="Acme Corp"
          class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
          [class.border-destructive]="submitted && form.controls.name.invalid"
        />
        @if (submitted && form.controls.name.invalid) {
          <span class="text-xs text-destructive">Name is required</span>
        }
      </div>

      <!-- Industry + Size -->
      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-medium">Industry</label>
          <select formControlName="industry" class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring">
            @for (industry of industries; track industry) {
              <option [value]="industry">{{ industryLabels[industry] }}</option>
            }
          </select>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-medium">Size</label>
          <select formControlName="size" class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring">
            @for (size of sizes; track size) {
              <option [value]="size">{{ sizeLabels[size] }}</option>
            }
          </select>
        </div>
      </div>

      <!-- Website -->
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium">Website</label>
        <input type="url" formControlName="website" placeholder="https://example.com"
          class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring" />
      </div>

      <!-- Phone + Email -->
      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-medium">Phone</label>
          <input type="tel" formControlName="phone"
            class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-medium">Email</label>
          <input type="email" formControlName="email"
            class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring" />
        </div>
      </div>

      <!-- Revenue -->
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium">Annual Revenue</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-muted-foreground">$</span>
          <input type="number" formControlName="revenue" min="0" placeholder="0"
            class="flex h-10 w-full rounded-md border border-input bg-background pl-7 pr-3 py-2 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring" />
        </div>
      </div>

      <!-- Address accordion -->
      <div class="rounded-md border border-border">
        <button
          type="button"
          class="flex w-full items-center justify-between px-4 py-3 text-sm font-medium hover:bg-muted/50 transition-colors"
          (click)="addressExpanded = !addressExpanded"
        >
          Address
          <span class="material-icons-round text-base transition-transform" [class.rotate-180]="addressExpanded">expand_more</span>
        </button>
        @if (addressExpanded) {
          <div class="border-t border-border p-4 flex flex-col gap-4" formGroupName="address">
            <div class="flex flex-col gap-1.5">
              <label class="text-sm font-medium">Street</label>
              <input type="text" formControlName="street"
                class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring" />
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium">City</label>
                <input type="text" formControlName="city"
                  class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring" />
              </div>
              <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium">State</label>
                <input type="text" formControlName="state"
                  class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring" />
              </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium">Country</label>
                <input type="text" formControlName="country"
                  class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring" />
              </div>
              <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium">Zip</label>
                <input type="text" formControlName="zip"
                  class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring" />
              </div>
            </div>
          </div>
        }
      </div>

      <!-- Notes -->
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium">Notes</label>
        <textarea formControlName="notes" rows="4"
          class="flex w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring resize-none"></textarea>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-end gap-3">
      <button
        type="button"
        class="inline-flex items-center rounded-md border border-input bg-background px-4 py-2 text-sm font-medium hover:bg-accent transition-colors"
        (click)="onCancel()"
      >Cancel</button>
      <button
        type="submit"
        class="inline-flex items-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:pointer-events-none"
        [disabled]="saving"
      >
        @if (saving) { Saving... } @else { {{ isEditMode ? 'Save Company' : 'Create Company' }} }
      </button>
    </div>
  </form>
</div>
