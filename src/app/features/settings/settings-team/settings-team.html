<section class="rounded-lg border bg-card text-card-foreground shadow-sm p-6 flex flex-col gap-6">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h2 class="text-base font-semibold text-foreground">Team</h2>
      <p class="text-sm text-muted-foreground mt-1">Your organization's Arcflow users.</p>
    </div>
    <button
      type="button"
      class="inline-flex items-center gap-2 rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground hover:bg-primary/90 transition-colors flex-shrink-0"
      (click)="onInvite()"
    >
      <span class="material-icons-round text-base">person_add</span>
      Invite Member
    </button>
  </div>

  <div class="h-px bg-border"></div>

  <div class="overflow-x-auto">
    <table
      mat-table
      [dataSource]="members"
      class="w-full"
    >
      <ng-container matColumnDef="avatar">
        <th mat-header-cell *matHeaderCellDef class="h-12 px-3 text-left text-sm font-medium text-muted-foreground w-12"></th>
        <td mat-cell *matCellDef="let member" class="p-3">
          <app-avatar [src]="member.avatar" [name]="member.name" size="sm"></app-avatar>
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef class="h-12 px-3 text-left text-sm font-medium text-muted-foreground">Name</th>
        <td mat-cell *matCellDef="let member" class="p-3 text-sm font-medium text-foreground">{{ member.name }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef class="h-12 px-3 text-left text-sm font-medium text-muted-foreground">Email</th>
        <td mat-cell *matCellDef="let member" class="p-3 text-sm text-muted-foreground">{{ member.email }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef class="h-12 px-3 text-left text-sm font-medium text-muted-foreground">Role</th>
        <td mat-cell *matCellDef="let member" class="p-3 text-sm">
          <span class="inline-flex items-center rounded-full bg-secondary px-2.5 py-0.5 text-xs font-semibold text-secondary-foreground">
            {{ roleLabel(member.role) }}
          </span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['avatar', 'name', 'email', 'role']" class="border-b border-border"></tr>
      <tr mat-row *matRowDef="let row; columns: ['avatar', 'name', 'email', 'role']" class="border-b border-border transition-colors hover:bg-muted/50"></tr>
    </table>
  </div>
</section>
