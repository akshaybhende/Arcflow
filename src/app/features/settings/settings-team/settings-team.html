<section class="settings-section">
  <div class="settings-team__header">
    <div>
      <h2 class="settings-section__title">Team</h2>
      <p class="settings-section__desc">Your organization's Arcflow users.</p>
    </div>
    <button mat-flat-button color="primary" type="button" (click)="onInvite()">
      <mat-icon>person_add</mat-icon>
      Invite Member
    </button>
  </div>

  <table mat-table [dataSource]="members" class="settings-team__table">
    <ng-container matColumnDef="avatar">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let member">
        <app-avatar [src]="member.avatar" [name]="member.name" size="sm"></app-avatar>
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let member">{{ member.name }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let member">{{ member.email }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let member">
        <span class="settings-team__role-badge">{{ roleLabel(member.role) }}</span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['avatar', 'name', 'email', 'role']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['avatar', 'name', 'email', 'role']"></tr>
  </table>
</section>
