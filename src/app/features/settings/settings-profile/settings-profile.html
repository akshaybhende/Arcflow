<section class="settings-section">
  <h2 class="settings-section__title">Profile</h2>
  <p class="settings-section__desc">Update your personal information and avatar.</p>

  <form [formGroup]="form" class="settings-section__form" (ngSubmit)="onSave()">
    <div class="settings-profile__avatar-row">
      <app-avatar [src]="avatarPreview ?? undefined" [name]="form.controls.name.value" size="xl"></app-avatar>
      <div>
        <input #avatarInput type="file" accept="image/*" hidden (change)="onAvatarSelected($event)" />
        <button mat-stroked-button type="button" (click)="avatarInput.click()">Upload photo</button>
        <p class="settings-section__hint">Preview only — not uploaded to a server.</p>
      </div>
    </div>

    <mat-form-field appearance="outline" class="settings-section__field">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="settings-section__field">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="settings-section__field">
      <mat-label>Department</mat-label>
      <input matInput formControlName="department" />
    </mat-form-field>

    <button mat-flat-button color="primary" type="submit">Save</button>
  </form>
</section>
