<div
  class="avatar"
  [class]="'avatar--' + size + ' avatar--' + shape"
  [style.background-color]="showImage ? undefined : backgroundColor"
>
  @if (showImage) {
    <img [src]="src" [alt]="name || 'Avatar'" (error)="onImageError()" />
  } @else if (name) {
    <span class="avatar__initials">{{ name | initials }}</span>
  } @else {
    <span class="material-icons-round avatar__fallback-icon">person</span>
  }
</div>
