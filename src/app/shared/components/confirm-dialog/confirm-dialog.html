<div class="p-6">
  <h2 class="text-lg font-semibold mb-2">{{ data.title }}</h2>
  <p class="text-sm text-muted-foreground mb-6">{{ data.message }}</p>
  <div class="flex justify-end gap-2">
    <button
      type="button"
      class="inline-flex items-center justify-center rounded-md border border-input bg-background px-4 py-2 text-sm font-medium hover:bg-accent hover:text-accent-foreground transition-colors"
      (click)="onCancel()"
    >
      {{ cancelLabel }}
    </button>
    <button
      type="button"
      class="inline-flex items-center justify-center rounded-md px-4 py-2 text-sm font-medium transition-colors"
      [class]="data.destructive ? 'bg-destructive text-destructive-foreground hover:bg-destructive/90' : 'bg-primary text-primary-foreground hover:bg-primary/90'"
      (click)="onConfirm()"
    >
      {{ confirmLabel }}
    </button>
  </div>
</div>
