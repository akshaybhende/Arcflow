<div
  class="flex h-full flex-col rounded-xl border border-border/80 bg-card p-5 shadow-sm transition-shadow hover:shadow-md"
>
  <div
    class="mb-4 flex h-10 w-10 shrink-0 items-center justify-center rounded-lg"
    [style.background]="iconBg"
    [style.color]="iconColor"
  >
    <span class="material-icons-round text-[22px]">{{ icon }}</span>
  </div>

  <div class="flex flex-1 flex-col gap-1">
    <span class="text-sm font-medium text-muted-foreground">{{ label }}</span>
    <span class="text-2xl font-bold tracking-tight text-foreground">{{ value }}</span>
  </div>

  @if (trend) {
    <div class="mt-4 flex flex-wrap items-center gap-x-1.5 gap-y-0.5 text-xs">
      <span
        class="inline-flex items-center gap-0.5 font-semibold"
        [class]="
          trendDirection === 'up'
            ? 'text-emerald-600'
            : trendDirection === 'down'
              ? 'text-destructive'
              : 'text-muted-foreground'
        "
      >
        <span class="material-icons-round text-sm leading-none">
          {{
            trendDirection === 'up'
              ? 'arrow_upward'
              : trendDirection === 'down'
                ? 'arrow_downward'
                : 'remove'
          }}
        </span>
        {{ trend }}
      </span>
      @if (trendPeriod) {
        <span class="text-muted-foreground">{{ trendPeriod }}</span>
      }
    </div>
  }
</div>
