@if (breadcrumbs?.length) {
  <nav class="page-header__breadcrumbs" aria-label="Breadcrumb">
    @for (crumb of breadcrumbs; track crumb.label; let last = $last) {
      @if (!last && crumb.route) {
        <a [routerLink]="crumb.route" class="page-header__crumb">{{ crumb.label }}</a>
      } @else {
        <span class="page-header__crumb" [class.page-header__crumb--current]="last">{{ crumb.label }}</span>
      }
      @if (!last) {
        <mat-icon class="page-header__separator" aria-hidden="true">chevron_right</mat-icon>
      }
    }
  </nav>
}

<div class="page-header__content">
  <h1 class="page-header__title">{{ title }}</h1>
  @if (subtitle) {
    <p class="page-header__subtitle">{{ subtitle }}</p>
  }
</div>
