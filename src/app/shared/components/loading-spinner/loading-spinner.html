<div class="flex flex-col items-center justify-center gap-3" role="status" [attr.aria-label]="label">
  <div
    class="animate-spin rounded-full border-2 border-current border-t-transparent text-primary"
    [style.width.px]="diameter"
    [style.height.px]="diameter"
  ></div>
  @if (label) {
    <span class="text-sm text-muted-foreground">{{ label }}</span>
  }
</div>
