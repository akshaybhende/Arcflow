name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: corepack enable && corepack prepare npm@11.6.2 --activate
      - run: npm ci
      - run: npm run lint
      - run: npm run build -- --configuration production
      - run: npm test -- --watch=false
